name: Android build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK
        run: |
          android --no-metrics --sdk="$ANDROID_HOME" sdk install 'platforms;android-37.2'
          android --no-metrics --sdk="$ANDROID_HOME" sdk install 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: cunqi-debug-and-unsigned-release
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: app/build/reports/
